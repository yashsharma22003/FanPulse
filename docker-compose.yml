services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "55432:5432"
    environment:
      POSTGRES_USER: fanpulse
      POSTGRES_PASSWORD: fanpulse
      POSTGRES_DB: fanpulse
    volumes:
      - fanpulse_pg:/var/lib/postgresql/data

volumes:
  fanpulse_pg:
